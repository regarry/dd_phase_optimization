# ==========================================
# 5. BEAD & SAMPLE GENERATION
# ==========================================
num_particles_range: [600, 601] # [min, max] emitters per image. Strong GPU: [450, 550]
bead_radius: 0.5          # pixels 1.0 default
z_coupled_ratio: 0.5
z_coupled_spacing_range: [1, 5] # need to change the code so that the z coupled beads are only generated around the in focus plane
gaussian_z_bead_dist: False # whether to use a gaussian distribution for the z positions of the beads or uniform 
z_gaussian_mu: 0.0 # need to finish this
z_gaussian_sigma_divisor: 6 # need to update this to be the span 

# ==========================================
# 1. OPTIMIZATION & TRAINING LOOP
# ==========================================
random_seed: 21
ntrain: 384  #960, 384          # default 640, how many bead volumes per epoch, multiple of 32 is nice
nvalid: 128  #128             # default 128

batch_size: 1              # Training batch size
accumulation_steps: 32 #32   # Gradient accumulation steps to simulate larger batch sizes
max_epochs: 1000 #1000            # 200
save_epoch_interval: 2
initial_learning_rate: 1.0e-1
gradient_checkpointing: False
quantize_slm: True # this is to show we are using quantized training now, not actually implemented as a config variable

# Learning Rate Scheduler
learning_rate_scheduler_factor: 0.5 # Factor by which the learning rate will be reduced
learning_rate_scheduler_patience: 10
learning_rate_scheduler_patience_min_lr: 1.0e-5

# early stopping
early_stopping_patience: 200   # Number of epochs with no improvement after which training
early_stopping_min_delta: 1.0e-5 # Minimum change in the monitored quantity to qualify as an improvement

# Loss Function & Weights
z_range_cost_function: [0, 0] # the range +- from z=0 that is considered ground truth
ce_class_weights: [0.1, 1.0, 2.0]   # cross entropy loss weights (must be floats)
ce_loss_weight: __CE_WEIGHT__ # (binary if num classes == 1) cross entropy loss weight
dice_loss_weight: __DICE_WEIGHT__ # F1 score aka DICE loss weight
mae_loss_weight: __MAE_WEIGHT__ # l1 loss or mean absolute error loss weight
mse_loss_weight: __MSE_WEIGHT__ # l2 loss or mean squared error loss weight
spatial_multi_well_loss_weight: __SLL_WEIGHT__
tv_loss_weight: 0.0        # Weight for the total variation loss of the phase mask
convolve_psf_ground_truth: True # whether to convolve the PSF with the ground truth for training instead of boolean labels (doesnt work with 3 classes)

freeze_unet: True # whether to freeze the unet weights during training (only optimize the phase mask)
freeze_slm: False
#disable_camera_simulation: True # not working yet

spatial_well_x: 5 # in pixels distance desired fwhm of center lobe
spatial_well_y: __SIDE_LOBE_RADIUS__ # in pixels distance from center where light is penalized
smw_z_min_mm: -0.064             # Min z-position for beam profile [mm]
smw_z_max_mm: 0.064              # Max z-position for beam profile [mm]
smw_y_min_mm: -0.064             # Min y-position for beam profile [mm]
smw_y_max_mm: 0.064             # Max y-position for beam profile [mm]
smw_num_z_steps: 100           # Simulation steps/planes across the z-range


## aberration
aberration: False
# Zernike polynomials
c5: -0.0010
c13: -0.0003

# ==========================================
# 2. OPTICAL SYSTEM & HARDWARE
# ==========================================
wavelength: 561.0e-9       # [m]
refractive_index: 1.0      # We assume propagation is in air
numerical_aperture: 0.28    # was 0.6 on main light but using 0.28 currently# Relates to the resolution of the detection objective

# Lenses (Focal Lengths in [m])
focal_length_1: 300.0e-3
focal_length_2: 70.0e-3    # focal length of the second lens
focal_length_3: 75.0e-3
focal_length_4: 40.0e-3
focal_length_5: 1.0e-3    # illumination objective lens (mitutoyo 10x M PLAN APO obj with 200mm tube lens)
fresnel_lens_focal_length: 3.75e-3
cylinder_focal_length: 3.75e-3
lensless_prop_distance: 3.75e-3 #6.6e-3 is ideal with 4.0 axicon this may exceed the asm limit of 3.65mm but should allow for high spatial freq features# Propagation distance from SLM for lensless imaging [m]
extra_prop_distance: 25.0e-3 # prop distance after 4f focal plane [m]

# Optical Setup Configuration
lens_approach: "sample_4f"        # "fourier_lens" or "4f" or "lensless"
angular_spectrum_method: True
debug_asm: False
aperature: False           # Typo in original (aperture), keeping as is for code compatibility
pad_4f: False                 # Whether to pad the field during 4f simulation to avoid aliasing

lowpass_pinhole_radius_mm: 2.7 # radius of lowpass pinhole in mm for ASM simulation, 
# ==========================================
# 3. SLM & PHASE MASK
# ==========================================
slm_px: 1.00e-6 # if 9.2um slm and we have 8x mag then 1.15 but round down to 1um            # Physical pixel size of the SLM [m]
phase_mask_pixel_size: 1024 # Number of pixels on the SLM side (resolution)
initial_phase_mask: __PHASE_MASK__
bessel_half_cone_angle_degrees: 4.0 # 0.5 max on galvo mirror then x8 so 4.0
airy_alpha: 1.0e-1 #Controls the cubic strength and dictates the "bending" trajectory of the Airy beam.
cylinder_axis: "x" # axis of the cylindrical lens if using cylindrical phase mask (x or y)
phase_mask_upsample_factor: 1 # Scale factor for phase mask upsampling (simulation vs physical)

# ==========================================
# 4. SIMULATION GRID & RESOLUTION
# ==========================================

# ***************** want to change this to input meters not px?
image_volume: [64, 1024, 256] #  0 means auto for first index # the first two dimensions should be powers of 2 for the u-net [y, x, z] volume of imaging in px (camera coordinates)
ratio_input_output_image_size: 1 # default with Unet 1, with ResNet 4

# ==========================================
# 6. ILLUMINATION & BEAM PROPERTIES
# ==========================================
bead_intensity: 1.0       # arbitrary units
illumination_scaling_factor: 1.0
laser_beam_FWHC: 0.5e-3 # 0.072e-3    # [m] FWHM of Gaussian beam

#max_intensity_conv: 8.0e+10 # convol: 5.0e+10, fresnel: 5e4
#max_intensity_fresnel: 5.0e+4

# Beam Profiler Specifics
z_min_mm: -1.0             # Min z-position for beam profile [mm]
z_max_mm: 1.0              # Max z-position for beam profile [mm]
y_min_mm: -0.3             # Min y-position for beam profile [mm]
y_max_mm: 0.3             # Max y-position for beam profile [mm]
num_z_steps: 200           # Simulation steps/planes across the z-range

# ==========================================
# 7. CAMERA & NOISE MODEL
# ==========================================
quantum_efficiency: 0.6   # (0-1)
dark_current_mean: 120    # Mean dark current electrons per pixel
read_noise_std: 60        # most significant SNR killer # Read noise std dev in electrons RMS
camera_gain: 0.46           # Electrons per ADU
camera_max_adu: 65535      # 16-bit depth
robust_max_percentile: 0.999 # percentile for robust max calculation for normalization of simulated images
target_saturation_ratio: 0.01 # target saturation ratio for simulated images (used to scale the bead intensity during training)
epsilon: 1.0e-6              # small constant to prevent division by zero in normalization
min_clip_value: 0.0              # minimum value to clip the normalized images to prevent extremely small values

# ==========================================
# 8. CNN ARCHITECTURE & INPUTS
# ==========================================
use_unet: True
conv3d: False
dropout: 0.0
num_classes: __NUM_CLASSES__            # 0=background, 1=bead, 2=between beads
z_depth_list: [0] #[-6 0 6]          # z slices input into the cnn

# ==========================================
# 9. PATHS & FILES
# ==========================================
data_path: "beads_img_defocus"
psf_image_path: "psf_images"
path_save: "data_mask_learning"
path_train: "traininglocations"
bfp_dir: "back_focal_plane"
training_data_path: "training_results"
defocused_beads_filename: "defocused_beads.mat"
phase_mask_file: "example_optimized_phase_0_deg_grating_p0_fresnel_f-240.0mm.bmp"

# ==========================================
# 10. PSF GENERATION UTILS
# ==========================================
#psf_width_pixels: 101      # How big will be the psf image
#psf_edge_remove: 15
#psf_keep_radius: 15
psf_padding: 10 # Extra pixels to ensure the diffraction rings trail off to 0
supersample_factor: 3      # Supersampling factor for PSF generation (1 to disable)
#z_stop: 50.0e-6           # float (end of z-stack for psf generation)


###### MULIT GPU SETUP
cnn_device: "cuda:0"
#phys_device: "cuda:1"